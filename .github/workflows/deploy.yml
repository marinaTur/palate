name: Deploy to Yandex Object Storage

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_ENDPOINT: ${{ secrets.VITE_API_ENDPOINT }}

      - name: Configure AWS CLI for Yandex Object Storage
        run: |
          aws configure set aws_access_key_id ${{ secrets.YC_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.YC_SECRET_ACCESS_KEY }}
          aws configure set region ru-central1

      - name: Upload dist/ to palatelearn.ru bucket
        run: |
          aws --endpoint-url=https://storage.yandexcloud.net s3 sync dist/ s3://palatelearn.ru/ --delete
