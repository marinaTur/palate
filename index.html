<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#993556" />
    <meta name="description" content="Palate — your pocket sommelier school. Learn to taste wine." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Palate</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      GTM and Yandex Metrica no longer auto-load here — both now require
      cookie consent first. See src/utils/loadAnalytics.js and
      src/components/ConsentBanner.jsx. window.dataLayer/window.ym are
      declared lazily inside those loaders, not here.
    -->
  </head>
  <body>
    <!--
      No <noscript> tracking fallback here on purpose: both Yandex's <img>
      ping and GTM's <iframe> fire unconditionally and can't be gated behind
      consent (there's no JS to check consent state with JS disabled) — so
      including them would defeat the whole point of gating. The tiny loss
      of analytics coverage for JS-disabled visitors is the correct trade.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
